<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дұрыс команданы ат!</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; overflow:hidden; font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#21103d,#542b72,#2d174d);
  color:white;
}
#game{height:100vh;position:relative}
.top{
  height:80px;display:flex;justify-content:space-between;align-items:center;
  padding:0 28px;background:rgba(20,8,35,.45);position:relative;z-index:5
}
.top b{font-size:22px}
#question{
  position:absolute;top:100px;left:50%;transform:translateX(-50%);
  width:min(800px,90%);text-align:center;font-size:24px;font-weight:800;line-height:1.35;
  padding:18px 24px;border-radius:22px;background:rgba(15,5,30,.75);
  box-shadow:0 8px 30px #0005;z-index:4
}
#field{position:absolute;top:190px;bottom:100px;left:0;right:0;overflow:hidden}
.choice{
  position:absolute;top:-65px;padding:14px 24px;border-radius:18px;
  background:#8d4dcc;border:3px solid #d9b5ff;color:white;
  font-size:20px;font-weight:800;cursor:pointer;white-space:nowrap;min-width:130px;text-align:center;
  box-shadow:0 8px 22px #0008, 0 0 18px rgba(190,120,255,.25);
  animation:floatAnswers 6s ease-in-out infinite;
  z-index:10;
}
.choice:hover{transform:scale(1.08);filter:brightness(1.25)}
@keyframes floatAnswers{
  0%{top:15px;opacity:1;transform:translateY(0)}
  50%{top:45%;opacity:1;transform:translateY(8px)}
  100%{top:15px;opacity:1;transform:translateY(0)}
}

#gun{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  font-size:58px;z-index:20;filter:drop-shadow(0 0 12px #dcaaff);
}
#result{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  z-index:100;pointer-events:none;
}
#result span{
  padding:25px 40px;border-radius:25px;background:#160923ee;
  font-size:clamp(38px,7vw,70px);font-weight:900;
  animation:pop .8s ease forwards;
}
#result.correct span{color:#58ff91;border:4px solid #58ff91;box-shadow:0 0 45px #58ff91}
#result.wrong span{color:#ff5577;border:4px solid #ff5577;box-shadow:0 0 45px #ff5577}
@keyframes pop{
  0%{opacity:0;transform:scale(.3)}
  20%{opacity:1;transform:scale(1.12)}
  70%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1)}
}
.bullet{
  position:fixed;width:12px;height:12px;border-radius:50%;
  background:white;box-shadow:0 0 10px white,0 0 25px #c05cff;
  z-index:200;pointer-events:none;
}
.explosion{position:fixed;z-index:201;font-size:42px;pointer-events:none;
  animation:boom .5s ease forwards}
@keyframes boom{
  from{transform:scale(.2);opacity:1}
  to{transform:scale(1.8);opacity:0}
}
#start{
  position:absolute;inset:0;background:linear-gradient(135deg,#35135b,#713b91);
  z-index:500;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;
}
#start h1{font-size:42px;margin:0 0 12px}
#start p{font-size:19px;opacity:.9}
button{
  border:0;border-radius:18px;padding:16px 38px;font-size:21px;
  font-weight:800;cursor:pointer;background:white;color:#542b72;
}
</style>
</head>
<body>
<div id="game">
  <div class="top"><b>🎯 Дұрыс команданы ат!</b><b>Ұпай: <span id="score">0</span> | ⏱️ <span id="time">60</span></b></div>
  <div id="question"></div>
  <div id="field"></div>
  <div id="gun">🔫</div>
  <div id="result"><span></span></div>

  <div id="start">
    <h1>🎯 Дұрыс команданы ат!</h1>
    <p>Дұрыс Python командасын тауып, оны ат!</p>
    <button onclick="startGame()">Ойынды бастау</button>
  </div>
</div>

<script>
const questions=[
 {q:'"python" сөзін барлық әріптерін бас әріпке айналдыру керек. Қай команда?',a:'upper()',o:['upper()','lower()','find()','split()']},
 {q:'"PYTHON" сөзін барлық әріптерін кіші әріпке айналдыру керек. Қай команда?',a:'lower()',o:['lower()','upper()','replace()','len()']},
 {q:'"Hello" сөзінің ұзындығын табу керек. Қай команда?',a:'len()',o:['len()','find()','split()','upper()']},
 {q:'"banana" сөзіндегі "a" әріптерін "o" әріптеріне ауыстыру керек. Қай команда?',a:'replace()',o:['replace()','find()','lower()','strip()']},
 {q:'"Python" сөзіндегі "th" бөлігінің орнын табу керек. Қай команда?',a:'find()',o:['find()','len()','upper()','split()']},
 {q:'"Алма-Алмұрт-Шие" мәтінін бөліктерге бөлу керек. Қай команда?',a:'split()',o:['split()','replace()','find()','lower()']},
 {q:'"  Hello  " мәтінінің басы мен соңындағы бос орындарды алып тастау керек. Қай команда?',a:'strip()',o:['strip()','split()','upper()','find()']},
 {q:'"hello" сөзінің бірінші әрпін бас әріпке айналдыру керек. Қай команда?',a:'capitalize()',o:['capitalize()','upper()','lower()','replace()']},
 {q:'"Computer" сөзіндегі бірінші символды алу үшін қай жазылым қолданылады?',a:'text[0]',o:['text[0]','text[1]','text[-1]','len(text)']},
 {q:'"Python" сөзіндегі соңғы символды алу үшін қай жазылым қолданылады?',a:'text[-1]',o:['text[-1]','text[0]','text[1]','text[len(text)]']},
 {q:'"Hello World" мәтінінде "World" сөзінің орнын табу керек. Қай команда?',a:'find()',o:['find()','split()','replace()','len()']},
 {q:'"school" сөзін "SCHOOL" түріне келтіру керек. Қай команда?',a:'upper()',o:['upper()','lower()','capitalize()','strip()']},
 {q:'"KAZAKHSTAN" сөзін "kazakhstan" түріне келтіру керек. Қай команда?',a:'lower()',o:['lower()','upper()','find()','split()']},
 {q:'"apple" сөзін "orange" сөзіне ауыстыру керек. Қай команда қолданылады?',a:'replace()',o:['replace()','find()','len()','upper()']},
 {q:'"A-B-C-D" жолын жеке бөліктерге бөлу керек. Қай команда?',a:'split()',o:['split()','strip()','lower()','find()']}
];

let score=0,time=60,current=null,timer=null,playing=false;

function startGame(){
 document.getElementById('start').style.display='none';
 score=0;time=60;playing=true;
 document.getElementById('score').textContent=score;
 document.getElementById('time').textContent=time;
 nextQuestion();
 clearInterval(timer);
 timer=setInterval(()=>{
   time--;document.getElementById('time').textContent=time;
   if(time<=0) endGame();
 },1000);
}

function nextQuestion(){
 if(!playing)return;
 document.getElementById('field').innerHTML='';
 current=questions[Math.floor(Math.random()*questions.length)];
 document.getElementById('question').textContent=current.q;
 [...current.o].sort(()=>Math.random()-.5).forEach((ans,i)=>{
   const b=document.createElement('div');
   b.className='choice';b.textContent=ans;
   b.style.left=['4%','29%','54%','79%'][i];
   b.style.animationDelay='0s';
   b.onclick=()=>shoot(b,ans);
   document.getElementById('field').appendChild(b);
 });
}

function shoot(btn,ans){
 if(!playing)return;
 const r=btn.getBoundingClientRect();
 const gun=document.getElementById('gun').getBoundingClientRect();
 const bullet=document.createElement('div');
 bullet.className='bullet';
 bullet.style.left=(gun.left+gun.width/2)+'px';
 bullet.style.top=(gun.top+10)+'px';
 document.body.appendChild(bullet);

 const dx=r.left+r.width/2-(gun.left+gun.width/2);
 const dy=r.top+r.height/2-(gun.top+10);
 bullet.animate([
   {transform:'translate(0,0)'},
   {transform:`translate(${dx}px,${dy}px)`}
 ],{duration:300,easing:'ease-out',fill:'forwards'});

 setTimeout(()=>{
   bullet.remove();
   const boom=document.createElement('div');
   boom.className='explosion';boom.textContent='💥';
   boom.style.left=(r.left+r.width/2-22)+'px';
   boom.style.top=(r.top+r.height/2-22)+'px';
   document.body.appendChild(boom);
   setTimeout(()=>boom.remove(),500);

   const correct=ans===current.a;
   if(correct)score+=10;else score-=5;
   document.getElementById('score').textContent=score;

   showResult(correct);
   btn.style.visibility='hidden';
   setTimeout(nextQuestion,900);
 },300);
}

function showResult(correct){
 const box=document.getElementById('result');
 box.className=correct?'correct':'wrong';
 box.querySelector('span').textContent=correct?'✓ ДҰРЫС ЖАУАП!':'✗ ҚАТЕ ЖАУАП!';
 box.style.display='flex';
 setTimeout(()=>box.style.display='none',800);
}

function endGame(){
 playing=false;clearInterval(timer);
 document.getElementById('field').innerHTML='';
 document.getElementById('question').textContent='Ойын аяқталды!';
 document.getElementById('start').style.display='flex';
 document.querySelector('#start h1').textContent='🏆 Ойын аяқталды!';
 document.querySelector('#start p').textContent='Сіздің ұпайыңыз: '+score;
 document.querySelector('#start button').textContent='Қайта ойнау';
}
</script>
</body>
</html>
